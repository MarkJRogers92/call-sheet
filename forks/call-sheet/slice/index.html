<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Sheet</title>
<style>
@font-face{font-family:'Barlow Condensed';font-weight:600;src:url('../../../assets/fonts/barlow-condensed-600.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:800;src:url('../../../assets/fonts/barlow-condensed-800.woff2') format('woff2')}
:root{color-scheme:dark;--bg:#07090f;--ink:#f6efdc;--muted:#a59d8a;--brass:#d6ad2f;--gold:#ffd84d;--panel:rgba(16,21,32,.86);--line:rgba(255,216,77,.18);
  --win:#72f08a;--lose:#ff5a4f;--hot:#ff9a3c;--home:#1d3b8f;--away:#7a1f2b;--sequence-brass:#f1c66d;--cond:'Barlow Condensed',Impact,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.cond{font-family:var(--cond);letter-spacing:.03em}
#root{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:grid;grid-template-columns:270px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  background:radial-gradient(ellipse at 50% -10%,rgba(255,236,170,.22),transparent 55%),radial-gradient(ellipse at 15% 0%,rgba(255,236,170,.12),transparent 40%),radial-gradient(ellipse at 85% 0%,rgba(255,236,170,.12),transparent 40%),linear-gradient(180deg,#0b1020,#06080d 70%)}
/* ---------- broadcast bug */
#bug{grid-column:1/-1;display:flex;justify-content:center;padding:6px 8px;z-index:5}
.bug{display:flex;align-items:stretch;border:1px solid #56616c;border-radius:6px;overflow:hidden;box-shadow:0 3px 8px #0005;font-family:var(--cond);font-variant-numeric:tabular-nums}
.bug .tm{display:flex;align-items:center;gap:8px;padding:4px 12px;min-width:150px;color:#fff}
.bug .tm.away{flex-direction:row-reverse}
.bug .ab{font-weight:800;font-size:22px;letter-spacing:.05em}
.bug .sc{font-weight:800;font-size:34px;min-width:44px;text-align:center;background:rgba(0,0,0,.28);padding:0 8px}
.bug .poss{width:11px;height:7px;border-radius:70% 30%;background:#ffdf64;box-shadow:0 0 0 1px #171d26;visibility:hidden;flex:none}
.bug .poss.on{visibility:visible}
.bug .mid{background:#111c28;padding:4px 14px;text-align:center;min-width:150px;border-inline:1px solid #1d2633}
.bug .clk{font-weight:800;font-size:20px}
.bug .dd{font-weight:800;font-size:15px;color:var(--gold);letter-spacing:.06em}
.bug .you{font-size:11px;opacity:.75;letter-spacing:.1em}
#ticker{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;display:flex;flex-direction:column-reverse;align-items:center;gap:4px;width:min(720px,94%)}
#ticker .tick:not(:first-child){opacity:.55;font-size:13px}
.tick{font-family:var(--cond);font-weight:600;font-size:15px;background:rgba(8,10,16,.82);border:1px solid var(--line);border-radius:20px;padding:3px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* ---------- side panel */
#side{grid-row:2/4;padding:8px 10px 10px;display:flex;flex-direction:column;gap:10px;overflow:auto;z-index:4}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.box h3{margin:0 0 6px;font-family:var(--cond);font-weight:800;font-size:15px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.exp{font-family:var(--cond);font-weight:800;font-size:46px;line-height:1;color:#fff;text-shadow:0 0 18px rgba(255,216,77,.5)}
.exp small{font-size:15px;color:var(--muted);margin-left:4px}
.kpis{display:flex;gap:10px;font-family:var(--cond);font-weight:800;font-size:15px;margin:4px 0 6px}
.kpis b{color:var(--gold)}
.drow{display:grid;grid-template-columns:24px 1fr auto;gap:6px;align-items:center;padding:5px 0;border-top:1px solid rgba(255,255,255,.06)}
.drow .k{font-family:var(--cond);font-weight:800;font-size:20px;color:var(--gold)}
.drow .n{font-size:12px;line-height:1.2}.drow .n b{font-size:12.5px}
.chip{font-family:var(--cond);font-weight:800;font-size:13px;letter-spacing:.06em;padding:3px 9px;border-radius:12px;text-transform:uppercase}
.chip.fogchip{outline:2px dashed rgba(159,227,255,.7);outline-offset:1px}
.chip.Strong{background:#1e7a37;color:#eaffea;box-shadow:0 0 12px rgba(114,240,138,.5)}.chip.Edge{background:#265c32;color:#d6ffd9}.chip.Even{background:#6a5714;color:#fff1b8}.chip.Tough{background:#7a3a1d;color:#ffd9c4}.chip.Danger{background:#8a1e1b;color:#ffd2ce;box-shadow:0 0 12px rgba(255,90,79,.45)}
.bonus{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bonus span{font-family:var(--cond);font-weight:800;font-size:12px;padding:2px 7px;border-radius:9px;background:rgba(255,154,60,.18);color:#ffcf9e;border:1px solid rgba(255,154,60,.4)}
.bonus span.neg{background:rgba(255,90,79,.15);color:#ffb8b1;border-color:rgba(255,90,79,.4)}
.hot{display:flex;align-items:center;gap:6px;font-family:var(--cond);font-weight:800;font-size:15px;padding:3px 0}
.flame{width:16px;height:22px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 80%,#fff3a6,#ff9a3c 45%,#ff3d1f 75%,transparent 76%);animation:flick .35s infinite alternate;filter:drop-shadow(0 0 6px #ff7a2a)}
@keyframes flick{to{transform:scaleY(1.15) skewX(4deg)}}
.combo{font-size:12.5px;padding:3px 0;color:var(--muted)}.combo.found{color:var(--ink)}.combo b{font-family:var(--cond);font-size:15px;color:var(--gold)}
.muted{color:var(--muted)}
.mini{font-size:12px;color:var(--muted)}
.tbtn{font-family:var(--cond);font-weight:800;letter-spacing:.08em;font-size:13px;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line);text-transform:uppercase}
.tbtn:hover{border-color:var(--gold)}
/* ---------- stage */
#stage{position:relative;overflow:hidden;min-height:0;min-width:0}
#fieldWrap{position:absolute;inset:0;perspective:1100px;display:flex;align-items:center;justify-content:center}
#field{width:min(96%,1280px);height:100%;max-height:100%;transform:rotateX(16deg);transform-origin:center;filter:drop-shadow(0 8px 12px #0007)}
#field[data-camera="formation"]{width:100%;transform:none;filter:none}
#field .pl{transition:none;cursor:pointer}
#field .pc-scale{transform:scale(var(--field-card-x,1),var(--field-card-y,1));transform-origin:0 0}
#field .pl .pc{transform-box:fill-box;transform-origin:center}
#field .pl .cbody{filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
#field .pl .nband{stroke:rgba(0,0,0,.35);stroke-width:.8}
#field .pl .num{fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.7);stroke-width:2px;font:800 10.5px 'Barlow Condensed',Impact,system-ui;letter-spacing:.3px}
#field .pl .glow{fill:none;stroke:transparent;stroke-width:6;opacity:0;transition:opacity .18s}
#field .pl:hover .glow{stroke:#fff;opacity:.8}
#field .pl.sig .cbody{stroke:#ffd34d;stroke-width:2.6}
#field .pl.sig .nband{fill:#c99a12!important}
#field .pl.hot .cbody{animation:hotp .5s infinite alternate}
@keyframes hotp{to{stroke:#ff7a1a;stroke-width:3.4}}
#field .pl.edge .glow{stroke:#3dff86;opacity:1;animation:plpulse .9s ease-in-out infinite alternate}
#field .pl.risk .glow{stroke:#ff3b4f;opacity:1;animation:plpulse .9s ease-in-out infinite alternate}
#field .pl.threat .glow{stroke:#ffb03c;opacity:.85;stroke-dasharray:5 3}
#field .pl.won .glow{stroke:#ffe066;opacity:1;stroke-width:9;animation:none}
#field .pl.decisive .glow{stroke:var(--sequence-brass);opacity:1;stroke-width:7;animation:none}
#field .pl.decisive .cbody{stroke:var(--sequence-brass);stroke-width:3}
#field .play-route{pointer-events:none;fill:none;stroke:var(--sequence-brass);stroke-linecap:round;stroke-linejoin:round;stroke-width:2.5;filter:drop-shadow(0 1px 2px #131715)}
#field .play-route .mesh{stroke:#efe6d2;stroke-width:1.5;stroke-dasharray:3 3}
@keyframes plpulse{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#field .pl .glow,#field .pl.hot .cbody{animation:none!important}}
#ptip{position:fixed;z-index:60;pointer-events:none;width:230px;padding:10px 12px;border-radius:12px;background:linear-gradient(160deg,#141b30,#0b0f1c);border:2px solid var(--tc,#3a4677);color:#eef2ff;font:13px/1.35 system-ui;box-shadow:0 14px 34px rgba(0,0,0,.6);opacity:0;transform:translateY(4px) scale(.97);transition:opacity .12s,transform .12s}
#ptip.on{opacity:1;transform:none}
#ptip.sig{border-color:#ffd34d;box-shadow:0 0 0 1px #ffd34d,0 0 22px rgba(255,211,77,.35),0 14px 34px rgba(0,0,0,.6)}
#ptip .tt-head{display:flex;gap:10px;align-items:center}
#ptip canvas{width:56px;height:56px;border-radius:8px;background:var(--tc);flex:none}
#ptip .tt-head>div>b{font:800 17px 'Barlow Condensed',Impact,system-ui;letter-spacing:.3px;display:block}
#ptip .tt-head span{display:block;font-size:11.5px;color:#aab6e8}#ptip .tt-head span b{color:#fff}
#ptip .tt-traits{margin-top:8px;display:grid;gap:3px}
#ptip .tt-traits div{display:grid;grid-template-columns:80px 1fr 38px;gap:6px;align-items:center;font-size:11.5px;text-transform:capitalize;color:#c9d2f5}
#ptip .tt-traits div.key span{color:#ffe066;font-weight:700}
#ptip .tt-traits i{height:5px;border-radius:3px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
#ptip .tt-traits i::after{content:'';position:absolute;inset:0;width:var(--v);background:linear-gradient(90deg,#3fc1ff,#7dffb0)}
#ptip .tt-traits b{text-align:right}
#ptip .tt-cond{margin-top:7px;display:grid;gap:3px}#ptip .tt-cond span{font-size:11.5px;padding:2px 6px;border-radius:5px;background:rgba(255,90,90,.14);color:#ffc4c4}#ptip .tt-cond span.up{background:rgba(61,255,134,.12);color:#b6ffd2}#ptip .tt-cond small{display:block;font-size:10px;opacity:.75}
#ptip .tt-notes{margin-top:7px;font-size:11.5px;display:grid;gap:2px}
#ptip .tt-notes div{padding:2px 6px;border-radius:5px;background:rgba(61,255,134,.12);color:#b6ffd2}
#ptip .tt-fire,#ptip .tt-sig{margin-top:6px;font:800 11px system-ui;letter-spacing:.12em;color:#ff9a3c}
#ptip .tt-sig{color:#ffd34d}
#ptip .tt-line{margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px}
#ptip .tt-line span{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8c98c9;margin-bottom:2px}
#ptip .tt-fog{margin-top:6px;font-size:11px;color:#9fe3ff}
#look{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;z-index:3;padding:0 10px}
.tag{font-family:var(--cond);font-weight:800;font-size:15px;letter-spacing:.07em;text-transform:uppercase;padding:5px 12px;border-radius:8px;border:2px solid;background:rgba(6,10,16,.78);backdrop-filter:blur(3px)}
.tag.conf{border-color:#72f08a;color:#d8ffe0;box-shadow:0 0 14px rgba(114,240,138,.35)}
.tag.unc{border-color:rgba(255,255,255,.35);border-style:dashed;color:#d9d3c4;background:repeating-linear-gradient(135deg,rgba(6,10,16,.85) 0 6px,rgba(40,48,64,.85) 6px 12px)}
.tag.lean{border-color:var(--hot);color:#ffd9b3;box-shadow:0 0 18px rgba(255,154,60,.6);animation:pulse 1s infinite alternate}
.tag.flip{animation:tagflip .6s}
@keyframes tagflip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg);background:#72f08a}100%{transform:rotateX(0)}}
@keyframes pulse{to{box-shadow:0 0 30px rgba(255,154,60,.9)}}
#drop{position:absolute;inset:14% 10% 18%;border:3px dashed var(--gold);border-radius:24px;display:none;align-items:center;justify-content:center;font-family:var(--cond);font-weight:800;font-size:44px;letter-spacing:.1em;color:var(--gold);background:rgba(255,216,77,.06);z-index:4;pointer-events:none;text-shadow:0 0 20px rgba(255,216,77,.7)}
#drop.on{display:flex}#drop.hover{background:rgba(255,216,77,.16)}
/* duel clash overlay */
#clash{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:7;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.25) 70%)}
#clash.on{display:flex}
.cl{position:relative;width:min(760px,96%);height:250px}
.cl .lab{position:absolute;top:0;left:0;right:0;text-align:center;font-family:var(--cond);font-weight:800;font-size:22px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;text-shadow:0 0 14px rgba(255,216,77,.6)}
.fighter{position:absolute;top:44px;width:42%;height:130px;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;border:2px solid rgba(255,255,255,.4);box-shadow:0 14px 40px rgba(0,0,0,.6)}
.fighter.o{left:0;background:linear-gradient(120deg,var(--oc),#0c111c 85%)}
.fighter.d{right:0;flex-direction:row-reverse;text-align:right;background:linear-gradient(240deg,var(--dc),#0c111c 85%)}
.face{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:26px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.5)}
.fighter .nm{font-family:var(--cond);font-weight:800;font-size:22px;line-height:1.05}
.fighter .ar{font-size:12px;opacity:.8}
.fighter .gr{font-family:var(--cond);font-weight:800;font-size:46px;line-height:1;margin-left:auto;color:var(--gold)}
.fighter.d .gr{margin-left:0;margin-right:auto}
.fighter.burn{box-shadow:0 0 0 3px #ff9a3c,0 0 30px #ff7a2a}
.vs{position:absolute;left:50%;top:84px;transform:translateX(-50%);font-family:var(--cond);font-weight:800;font-size:44px;color:#fff;text-shadow:0 0 18px #ff5a2a}
.mods{position:absolute;top:186px;left:0;right:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dsum{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:start;text-align:left;margin-top:2px}
.dcol{min-width:0;display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:8px;row-gap:1px;align-items:baseline;font-family:var(--cond);font-weight:800;padding:4px 8px;border-radius:8px;background:#0e1626}
.dcol.o{border-left:3px solid var(--gold)}.dcol.d{border-right:3px solid #9fb0c8}
.dwho{grid-column:1/-1;font-size:13px;letter-spacing:.04em;color:#c9d3e3;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcol .add,.dcol .dtotal{display:contents}
.dcol b{text-align:right;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dcol span{font:12px/1.3 system-ui,sans-serif;color:#c9d3e3;overflow-wrap:anywhere}
.dcol .dtotal b,.dcol .dtotal span{border-top:2px solid #f4edda;margin-top:3px;padding-top:2px}
.dcol .dtotal b{font-size:24px;color:var(--gold)}
.dvs{align-self:end;font-family:var(--cond);font-weight:800;font-size:18px;color:#f4edda;padding-bottom:4px}
.dverdict{margin-top:6px;font:13px/1.4 system-ui,sans-serif;color:#e6ecf7;text-align:center}
@media(max-width:600px){.dsum{gap:4px}.dcol{padding:3px 5px;column-gap:5px}.dcol b{font-size:15px}.dcol .dtotal b{font-size:18px}.dcol span{font-size:11px}.dvs{font-size:14px}.dwho{font-size:11px}}
#side .read-sum{margin:2px 0 8px}#side .read-sum .dsum{gap:4px}#side .read-sum .dcol{padding:3px 5px;column-gap:5px}#side .read-sum .dcol b{font-size:13px}#side .read-sum .dcol .dtotal b{font-size:15px}#side .read-sum .dcol span{font-size:10px}#side .read-sum .dwho{font-size:10px}#side .read-sum .dvs{font-size:11px}#side .read-sum .dverdict{font-size:11px;margin-top:3px}
.mods span{font-family:var(--cond);font-weight:800;font-size:16px;padding:3px 10px;border-radius:10px;background:#ff9a3c;color:#1a0c00;opacity:0}
.mods span.neg{background:#ff5a4f;color:#fff}.mods span.design{background:rgba(255,255,255,.18);color:#fff}
.stamp{position:absolute;left:50%;top:64px;transform:translateX(-50%) rotate(-8deg) scale(3);font-family:var(--cond);font-weight:800;font-size:72px;letter-spacing:.06em;padding:0 18px;border:6px solid;border-radius:12px;opacity:0;background:rgba(0,0,0,.5)}
.stamp.w{color:var(--win);border-color:var(--win);text-shadow:0 0 20px var(--win)}.stamp.l{color:var(--lose);border-color:var(--lose);text-shadow:0 0 20px var(--lose)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9;mix-blend-mode:screen}
#yards{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--cond);font-weight:800;font-size:120px;line-height:1;z-index:8;pointer-events:none;opacity:0;text-shadow:0 0 30px rgba(255,216,77,.8),0 6px 0 #000}
#callout{position:absolute;left:0;right:0;top:46%;text-align:center;z-index:8;pointer-events:none}
.co{display:inline-block;font-family:var(--cond);font-weight:800;font-size:clamp(48px,9vw,110px);letter-spacing:.04em;line-height:1;padding:6px 26px;transform:skewX(-8deg);color:#1a1200;background:linear-gradient(180deg,#fff2a8,#ffcc33 50%,#e09a10);border:4px solid #fff;box-shadow:0 0 0 4px #000,0 0 60px rgba(255,204,51,.8)}
.co.bad{color:#fff;background:linear-gradient(180deg,#ff8a7a,#e0322a 55%,#a5170f);box-shadow:0 0 0 4px #000,0 0 60px rgba(255,60,40,.8)}
.co.cool{color:#fff;background:linear-gradient(180deg,#9ad8ff,#3f8fe0 55%,#1d4f9a);box-shadow:0 0 0 4px #000,0 0 50px rgba(63,143,224,.8)}
.co.hotc{color:#1a0700;background:linear-gradient(180deg,#fff0a0,#ff9a3c 45%,#ff3d1f)}
.co.small{font-size:clamp(30px,5vw,56px)}
.co .sub{display:block;font-size:.32em;letter-spacing:.12em;margin-top:2px}
.rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(rgba(255,230,140,.16) 0 6deg,transparent 6deg 18deg);animation:spin 9s linear infinite;pointer-events:none;z-index:6;opacity:0;transition:opacity .4s}
.rays.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- hand */
#hand{grid-column:2;position:relative;z-index:5;padding:42px 28px;display:flex;align-items:flex-end;gap:14px;justify-content:safe center;min-width:0;min-height:268px;overflow-x:auto;transition:transform .35s ease,opacity .35s}
#hand.away{transform:translateY(110%);opacity:0;pointer-events:none}
.fan{flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;padding-top:30px}
.fan .card{margin:0 -14px}
.fanlab{position:absolute;top:-2px;font-family:var(--cond);font-weight:800;font-size:12px;letter-spacing:.2em;color:var(--muted)}
.cmd{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:6px}
.coins{display:flex;gap:5px}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4b8,#ffd84d 40%,#b8870f);box-shadow:0 0 12px rgba(255,216,77,.7),inset 0 -2px 0 rgba(0,0,0,.3)}
.coin.spend{animation:spend .5s infinite alternate}
.coin.gone{background:#232a38;box-shadow:inset 0 0 0 2px #3a4458}
@keyframes spend{to{opacity:.35;transform:translateY(-3px)}}
.cmdl{font-family:var(--cond);font-weight:800;letter-spacing:.12em;font-size:13px;color:var(--gold)}
.snap{font-family:var(--cond);font-weight:800;font-size:28px;letter-spacing:.1em;padding:10px 26px;border-radius:14px;color:#1a1200;background:linear-gradient(180deg,#fff2a8,#ffcc33 55%,#d48f08);border:3px solid #fff;box-shadow:0 0 0 3px #000,0 8px 30px rgba(255,204,51,.5);animation:breathe 1.1s infinite alternate}
.snap:disabled{filter:grayscale(1) brightness(.5);animation:none;cursor:not-allowed}
@keyframes breathe{to{transform:scale(1.05);box-shadow:0 0 0 3px #000,0 8px 44px rgba(255,204,51,.9)}}
.auto{font-family:var(--cond);font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:4px 8px}
.auto:hover{color:var(--ink)}
.err{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-family:var(--cond);font-weight:800;font-size:15px;color:#ffb8b1;white-space:nowrap}
/* ---------- cards */
.card{position:relative;width:128px;height:184px;border-radius:12px;padding:7px 8px;display:flex;flex-direction:column;gap:3px;text-align:left;color:var(--ink);
  background:linear-gradient(170deg,#202a3d,#121826 70%);border:2px solid #4a5468;transform-style:preserve-3d;
  transform:perspective(700px) translateY(calc(var(--arc,0px) + var(--lift,0px))) rotate(var(--rot,0deg)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .14s ease,box-shadow .2s,border-color .2s;box-shadow:0 10px 24px rgba(0,0,0,.55)}
.fan .card:hover{--lift:-26px;z-index:10}
.card.sel{--lift:-40px;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 30px rgba(255,216,77,.6),0 18px 30px rgba(0,0,0,.6);z-index:9}
.card.blocked{filter:grayscale(.85) brightness(.6)}
.card::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;border-radius:10px 10px 0 0;background:var(--fam)}
.card .cost{position:absolute;right:-8px;top:-8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:18px;color:#1a1200;background:radial-gradient(circle at 35% 30%,#fff4b8,#ffd84d 45%,#b8870f);box-shadow:0 0 10px rgba(255,216,77,.7),0 2px 0 #000;z-index:2}
.card .cname{font-family:var(--cond);font-weight:800;font-size:17px;line-height:1;margin-top:4px;padding-right:14px}
.card .art{display:block;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.12);height:58px}
.card .art svg{display:block;width:100%;height:100%}
.card .ticon{height:58px;display:grid;place-items:center;font-size:34px;color:var(--gold);background:radial-gradient(circle,rgba(255,216,77,.2),transparent 70%);text-shadow:0 0 14px var(--gold)}
.card .ctype{font-family:var(--cond);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fam)}
.card .ctext{font-size:10.5px;line-height:1.25;color:#d6cfbd;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.card .cwhy{position:absolute;left:6px;right:6px;bottom:6px;font-size:10.5px;font-weight:700;color:#ffb8b1;background:rgba(0,0,0,.75);border-radius:6px;padding:3px 5px}
.card .notch{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font-family:var(--cond);font-weight:800;font-size:11px;letter-spacing:.08em;white-space:nowrap;color:#1a0c00;background:var(--hot);border-radius:6px;padding:1px 7px;box-shadow:0 0 14px var(--hot);animation:pulse 1s infinite alternate}
.card .rar{position:absolute;left:8px;bottom:5px;font-family:var(--cond);font-weight:800;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.card.info{border-style:dashed}
.card .shine{position:absolute;inset:0;border-radius:10px;pointer-events:none;background:radial-gradient(circle at var(--sx,50%) var(--sy,0%),rgba(255,255,255,.18),transparent 45%);mix-blend-mode:screen}
.card.r-rare{border-color:#ffd84d;background:linear-gradient(170deg,#3a2f12,#161a22 70%)}
.card.r-rare .rar{color:var(--gold)}
.card.r-rare .shine{background:radial-gradient(circle at var(--sx,50%) var(--sy,0%),rgba(255,230,140,.35),transparent 50%),linear-gradient(115deg,transparent 30%,rgba(255,240,180,.25) 45%,transparent 60%);background-size:100% 100%,250% 100%;animation:sweep 2.6s infinite}
@keyframes sweep{from{background-position:0 0,120% 0}to{background-position:0 0,-120% 0}}
.card.r-legendary{border:2px solid transparent;background:linear-gradient(170deg,#24123a,#101522 70%) padding-box,conic-gradient(from var(--a,0deg),#ff5a5a,#ffd84d,#72f08a,#3fc1ff,#c07bff,#ff5a5a) border-box;animation:holo 3s linear infinite}
.card.r-legendary .rar{background:linear-gradient(90deg,#ff7a7a,#ffe066,#7af0a0,#7ad0ff,#d09bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card.r-legendary .shine{background:linear-gradient(125deg,rgba(255,0,80,.18),rgba(255,230,0,.18),rgba(0,255,160,.18),rgba(0,160,255,.18),rgba(200,0,255,.18));background-size:300% 300%;animation:holoShine 4s linear infinite;mix-blend-mode:color-dodge}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes holo{to{--a:360deg}}
@keyframes holoShine{to{background-position:300% 300%}}
.card.small{width:104px;height:150px}.card.small .ctext{display:none}
/* ---------- modals */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-start;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,14,24,.88),rgba(0,0,0,.96));overflow:auto;padding:max(14px,env(safe-area-inset-top,14px)) 16px max(18px,env(safe-area-inset-bottom,18px))}
#modal.on{display:flex}
.pinned-call{margin:0 0 4px;font:13px/1.35 system-ui,sans-serif;color:#c9d3e3}.pinned-call span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9fb0c8}.pinned-call b{color:#f4edda}.pinned-call em{font-style:normal}.pinned-call .lost{color:#ffb4a8}.pinned-call .won{color:#b9f0c2}
.fourth-last{max-width:460px;margin:0 auto 14px;padding:9px 13px;border:1px solid #dfc36566;border-radius:9px;background:#101722;display:grid;gap:3px;text-align:left;font:14px/1.35 system-ui,sans-serif;color:#f4edda}
.fourth-last .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#dfc365}
.fourth-last b{font-size:15px}
.fourth-last .lost{color:#ffb4a8}.fourth-last .won{color:#b9f0c2}
.setup-cue{margin:6px 0;padding:8px 11px;border:1px solid #6fbf8a66;border-left:3px solid #6fbf8a;border-radius:8px;background:#0f1d18;display:grid;gap:4px;font:13px/1.35 system-ui,sans-serif;color:#e6f3ea}
.setup-cue .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9ee0b3}
.setup-cue small{color:#b7c9bd}.setup-cue .tbtn{justify-self:start}
.staff-recap{margin:0 0 6px;font:13px/1.35 system-ui,sans-serif;color:#c9d3e3}.staff-recap summary{cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9fb0c8}
.staff-recap ul{margin:4px 0 0;padding-left:18px}.staff-recap b{color:#f4edda}
.look-certainty{display:block;flex-basis:100%;color:#b9c4d4}
.challenge-calls{margin:12px 0;font:14px/1.4 system-ui,sans-serif}.challenge-calls ol{margin:6px 0 0;padding-left:20px}.challenge-calls li{margin:0 0 6px}.challenge-calls li span{display:block;color:#c9d3e3}
.drive-log{margin:10px auto;max-width:520px;text-align:left;font:13px/1.4 system-ui,sans-serif}.drive-log ol{padding-left:20px}
.mwrap{width:min(1000px,100%);margin:auto;text-align:center}
.big{font-family:var(--cond);font-weight:800;font-size:clamp(56px,12vw,140px);line-height:.9;letter-spacing:.03em;margin:0}
.gold{background:linear-gradient(180deg,#fff6c8,#ffd84d 50%,#c98a0a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,216,77,.5))}
.red{background:linear-gradient(180deg,#ffc2bb,#ff5a4f 55%,#9a1a12);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{font-family:var(--cond);font-weight:800;letter-spacing:.1em;font-size:20px;padding:12px 26px;border-radius:12px;background:rgba(255,255,255,.07);border:2px solid var(--line);text-transform:uppercase;margin:6px}
.btn:hover{border-color:var(--gold)}
.btn.go{color:#1a1200;background:linear-gradient(180deg,#fff2a8,#ffcc33 55%,#d48f08);border-color:#fff;box-shadow:0 0 0 3px #000,0 0 30px rgba(255,204,51,.6)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.tcard{padding:14px;border-radius:14px;background:var(--panel);border:2px solid var(--line);text-align:left}
.tcard:hover,.tcard.sel{border-color:var(--gold);box-shadow:0 0 24px rgba(255,216,77,.35)}
.tcard .tn{font-family:var(--cond);font-weight:800;font-size:24px;line-height:1}
.tcard .ts{width:100%;height:6px;border-radius:3px;margin:8px 0}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.opt{font-family:var(--cond);font-weight:800;letter-spacing:.08em;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:rgba(255,255,255,.05);text-transform:uppercase}
.opt.on{border-color:var(--gold);color:var(--gold)}
.statline{font-family:var(--cond);font-weight:800;font-size:18px;letter-spacing:.06em;color:var(--muted)}
.statline b{color:var(--ink)}
/* pack */
.pack{width:220px;height:310px;margin:20px auto;border-radius:16px;position:relative;cursor:pointer;
  background:linear-gradient(135deg,var(--pa,#c9a227),var(--pb,#5a3b00));border:3px solid #fff;box-shadow:0 0 0 4px #000,0 30px 60px rgba(0,0,0,.7),0 0 60px rgba(255,216,77,.4);animation:bob 1.6s ease-in-out infinite alternate;overflow:hidden}
.pack::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);background-size:250% 100%;animation:sweep 2.2s infinite}
.pack .pt{position:absolute;left:0;right:0;top:40%;font-family:var(--cond);font-weight:800;font-size:40px;line-height:.9;color:#fff;text-shadow:0 3px 0 #000}
.pack .ps{position:absolute;left:0;right:0;bottom:22px;font-family:var(--cond);font-weight:800;letter-spacing:.2em;font-size:13px;color:#fff}
.pack .half{position:absolute;left:0;right:0;background:inherit}
@keyframes bob{to{transform:translateY(-10px) rotate(1deg)}}
.reveal{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:24px 0;min-height:230px}
.slot{width:150px;height:240px;position:relative;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.slot .back,.slot .front{position:absolute;left:0;top:0;width:150px;height:216px}
.slot .front{display:none}
.slot.flipped .front{display:block}.slot.flipped .back{display:none}
.slot .why{position:absolute;left:0;right:0;top:220px}
.slot .back{border-radius:12px;background:repeating-linear-gradient(45deg,#1a2234 0 10px,#151b29 10px 20px);border:3px solid var(--brass);box-shadow:0 10px 30px rgba(0,0,0,.6);display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:22px;color:var(--brass);letter-spacing:.1em}
.slot .front .card{width:150px;height:216px}
.slot .front .card .ctext{font-size:11.5px}
.slot.pickable{cursor:pointer}
.slot.pickable:hover{transform:translateY(-12px)}
.slot.burn .front{animation:burn 1s forwards}
@keyframes burn{0%{filter:none}40%{filter:brightness(1.8) sepia(1) saturate(4) hue-rotate(-20deg)}100%{filter:brightness(.2) sepia(1);opacity:0;transform:translateY(30px) scale(.85)}}
.slot.chosen{transform:scale(1.18) translateY(-10px);z-index:2}
.slot.chosen .front .card{box-shadow:0 0 0 3px var(--gold),0 0 60px rgba(255,216,77,.9)}
.why{font-family:var(--cond);font-weight:800;font-size:12px;letter-spacing:.06em;color:#9fe3ff;margin-top:6px;min-height:16px}
.legend{position:fixed;left:0;right:0;top:12%;text-align:center;z-index:22;pointer-events:none}
.pbgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.cutme{cursor:pointer}.cutme:hover .card{box-shadow:0 0 0 3px var(--lose),0 0 30px rgba(255,90,79,.7)}

/* evolution, league, scouting */
.card.r-evolved{border-color:#3cf0c0;background:linear-gradient(170deg,#0f3a33,#101826 70%);box-shadow:0 0 18px rgba(60,240,192,.35),0 10px 24px rgba(0,0,0,.55)}
.card.r-evolved .rar{color:#7dffd8}
.card.r-evolved .shine{background:radial-gradient(circle at var(--sx,50%) var(--sy,0%),rgba(120,255,220,.28),transparent 50%),repeating-linear-gradient(135deg,transparent 0 14px,rgba(60,240,192,.07) 14px 16px)}
.mbar{position:absolute;left:8px;right:8px;bottom:-6px;height:6px;border-radius:3px;background:rgba(0,0,0,.7);border:1px solid rgba(60,240,192,.5);overflow:hidden;z-index:2}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#1ea888,#3cf0c0)}
.mbar.full{box-shadow:0 0 12px #3cf0c0;animation:pulse 0.8s infinite alternate}
.stand{width:100%;border-collapse:collapse;font-size:14px}
.stand td,.stand th{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}
.stand th{font-family:var(--cond);letter-spacing:.12em;font-size:12px;color:var(--muted)}
.stand tr[data-prog]{cursor:pointer}.stand tr[data-prog]:hover{background:rgba(255,216,77,.08)}
.stand tr.you td{color:var(--gold)}
.leg{font-family:var(--cond);font-weight:800;letter-spacing:.04em;background:linear-gradient(90deg,#ff7a7a,#ffe066,#7af0a0,#7ad0ff,#d09bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.news{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:16px 0}
.nitem{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:130px}
.nitem .ntxt{font-family:var(--cond);font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--muted);min-height:32px}
.nitem.legpull .ntxt{color:var(--gold)}
.card.small .ctype{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evo{display:flex;justify-content:center;margin:18px 0 6px}
.evoRoot .card{width:150px;height:216px;box-shadow:0 0 40px rgba(60,240,192,.7);animation:pulse .7s infinite alternate}
.branches{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.branch{position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.branch .card{width:150px;height:216px}
.branch:hover .card{box-shadow:0 0 0 3px #3cf0c0,0 0 40px rgba(60,240,192,.8)}
.btag{font-family:var(--cond);font-weight:800;letter-spacing:.2em;font-size:14px;color:#7dffd8}
.evostamp{position:absolute;left:50%;top:40%;transform:translateX(-50%) rotate(-10deg);font-family:var(--cond);font-weight:800;font-size:40px;color:#3cf0c0;border:5px solid #3cf0c0;border-radius:10px;padding:0 12px;background:rgba(0,0,0,.6);text-shadow:0 0 18px #3cf0c0;animation:tagflip .4s}

/* signatures, breakout, rivalry, weather */
#wx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.card.r-signature{border:2px solid #ffd84d;background:linear-gradient(160deg,#1a1408,#050505 60%,#1a1408);box-shadow:0 0 22px rgba(255,216,77,.45),0 10px 24px rgba(0,0,0,.6)}
.card.r-signature .rar{color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.card.r-signature .shine{background:linear-gradient(115deg,transparent 25%,rgba(255,230,140,.35) 40%,transparent 55%),repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,216,77,.06) 10px 11px);background-size:250% 100%,100% 100%;animation:sweep 2s infinite}
.card.r-legacy{border:2px solid #9fc3ff;background:linear-gradient(160deg,#0e1a2e,#05070c 60%,#0e1a2e);box-shadow:0 0 20px rgba(159,195,255,.4),0 10px 24px rgba(0,0,0,.6)}
.card.r-legacy .rar{color:#cfe0ff}.card.r-legacy .shine{background:linear-gradient(115deg,transparent 30%,rgba(200,225,255,.3) 45%,transparent 60%);background-size:250% 100%;animation:sweep 3s infinite}
.slot .back[style*="--tb1"]{background:repeating-linear-gradient(45deg,var(--tb1) 0 10px,color-mix(in srgb,var(--tb1) 70%,#000) 10px 20px);border-color:var(--tb2);color:var(--tb2)}
.card .finish{position:absolute;right:8px;bottom:5px;font-family:var(--cond);font-weight:800;font-size:9px;letter-spacing:.16em;padding:1px 5px;border-radius:6px;z-index:2}
.card.f-foil .finish{background:linear-gradient(90deg,#9ad8ff,#e0b0ff,#a6ffd8);color:#0b0f18}.card.f-gold .finish{background:linear-gradient(90deg,#ffe58a,#c8901a);color:#1a1200}
.card.f-foil::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(154,216,255,.0) 20%,rgba(224,176,255,.22) 40%,rgba(166,255,216,.22) 55%,rgba(154,216,255,0) 75%);background-size:250% 100%;animation:sweep 2.6s infinite;mix-blend-mode:screen}
.card.f-gold{box-shadow:0 0 0 2px #e5b53a,0 0 26px rgba(229,181,58,.55),0 10px 24px rgba(0,0,0,.6)}
.card .origin{position:absolute;left:-1px;top:-1px;padding:2px 7px 2px 8px;border-radius:12px 0 10px 0;font-family:var(--cond);font-weight:800;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#0b0f18;background:#e5c766;z-index:2}
.card.o-legacy .origin{background:#9fc3ff}.card.o-coaching-tree .origin{background:#7ad0a6}.card.o-two-minute-drill .origin{background:#ff9f5a}.card.o-trick .origin{background:linear-gradient(90deg,#ff7a7a,#ffe066)}.card.o-weather .origin{background:#8fd3ff}.card.o-milestone .origin{background:#d09bff}
.card.small .origin{font-size:9px;padding:1px 5px}
.sigart{height:58px;display:flex;align-items:center;gap:6px;background:radial-gradient(circle at 30% 50%,rgba(255,216,77,.25),transparent 70%)}
.sigface{width:58px;height:58px;border-radius:50%;border:2px solid #ffd84d;background:#111}
.signum{font-family:var(--cond);font-weight:800;font-size:30px;line-height:1;color:var(--gold)}.signum small{display:block;font-size:12px;letter-spacing:.14em;color:var(--muted)}
.spot{position:fixed;left:50%;top:-20%;width:70vmax;height:140vh;margin-left:-35vmax;background:radial-gradient(ellipse at 50% 0%,rgba(255,240,200,.28),transparent 65%);pointer-events:none;animation:spot 3s ease-in-out infinite alternate}
@keyframes spot{to{transform:rotate(4deg)}}
.bo{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin:10px 0}
#boFace{width:180px;height:180px;border-radius:50%;border:4px solid var(--gold);box-shadow:0 0 50px rgba(255,216,77,.6);background:#111}
.boText{text-align:left;min-width:0}.boNum{font-family:var(--cond);font-weight:800;font-size:44px;line-height:1}
#boCard .card{width:150px;height:216px}
.trophy{width:160px;height:160px;margin:0 auto;background-repeat:no-repeat;background-size:5760px 160px;filter:drop-shadow(0 0 30px rgba(255,200,80,.6));animation:turn 3.2s steps(35) infinite}
@keyframes turn{from{background-position:0 0}to{background-position:-5600px 0}}
.trophyWrap.won .trophy{animation:turn 3.2s steps(35) infinite,trophyWin 1s cubic-bezier(.2,1.4,.4,1)}
@keyframes trophyWin{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.rivalry{margin:12px auto;padding:10px;border:2px solid #e0322a;border-radius:14px;max-width:560px;background:radial-gradient(ellipse at center,rgba(224,50,42,.25),transparent 70%)}
.rivTag{font-family:var(--cond);font-weight:800;letter-spacing:.3em;font-size:22px;color:#ff6b5e;animation:rivGlow .8s infinite alternate}
@keyframes rivGlow{from{text-shadow:0 0 8px #e0322a}to{text-shadow:0 0 26px #ff3d2a}}

/* seasons, roster, signing day, how to play */
.nextStrip{display:inline-flex;align-items:center;gap:18px;text-align:left;padding:10px 16px;margin:6px;border-radius:14px;background:var(--panel);border:2px solid var(--line)}
.nextStrip.riv{border-color:#e0322a;box-shadow:0 0 24px rgba(224,50,42,.4)}
.nsName{font-family:var(--cond);font-weight:800;font-size:30px;line-height:1;-webkit-text-stroke:1px rgba(255,255,255,.6)}
.ptiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
.ptile{width:150px;padding:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.ptile canvas{width:72px;height:72px;border-radius:50%;border:2px solid var(--brass);background:#111}
.ptName{font-family:var(--cond);font-weight:800;font-size:17px;line-height:1.05}
.roh{color:var(--gold);font-family:var(--cond);font-weight:800;letter-spacing:.06em}
.classRow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:16px 0}
.recruit .spotLab{width:auto;text-align:center;font-size:14px;color:var(--gold)}
.rcycle{font-size:11px;color:var(--muted);margin-top:4px}
.spotRow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;margin:10px 0;padding:8px;border-radius:12px;background:rgba(255,255,255,.03)}
.spotLab{font-family:var(--cond);font-weight:800;font-size:18px;letter-spacing:.08em;width:130px;text-align:right;color:var(--muted)}

.full-snap #ticker .tick:not(:first-child){display:none}
.full-snap #matchupStory{border-width:1px 0 0;border-radius:0;border-color:#946f3f;background:#18212a}
.full-snap #stage:has(#matchupStory:not([hidden])) #ticker{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;padding:0}
#side{background:#101822}
#side .box{box-shadow:none;border-radius:7px;border-color:#34424e;background:#17212c}
#side .box h3{color:#ead092;letter-spacing:.1em}
#side .mini{color:#c1c7c8}

#root.full-snap #hand{border-top:2px solid #4b6061;background:#101924}
.sheet-cards .fanlab{color:#dacda8;font-size:13px;letter-spacing:.11em}
#hand .fan .card{border-radius:7px;box-shadow:0 2px 5px #0004}
#hand .fan .card:before{height:3px;border-radius:6px 6px 0 0}
#hand .fan .card .cost{border-radius:5px;background:#f4d677;border:1px solid #a58a40;box-shadow:none}
#hand .fan .card .art{border-radius:4px}
#hand .fan .card .origin{position:static;align-self:flex-start;border-radius:3px;margin-top:2px;padding:1px 5px}
#hand .fan .card .ticon{height:100%;text-shadow:none;background:#172538}
#hand .fan .card .shine{opacity:.36}
#hand .fan .card.sel{border-color:#ffe078;box-shadow:inset 0 0 0 1px #ffe078;background-color:#29323b}
#hand .fan .card.sel .ctype:after{content:' ✓';color:#ffe078}
#hand .fan .card .cwhy,#hand .fan .card .setup-ready{position:static;display:block;white-space:normal;margin-top:2px}
#hand .fan .card .setup-ready{color:#f9e8a4;background:#3b3523;padding:2px 4px;text-align:left}
#hand .cmd .coins{gap:3px}
#hand .cmd .coin{width:13px;height:6px;border-radius:2px;background:#e8c765;box-shadow:none}
#hand .cmd .coin.gone{background:#364352;outline:1px solid #586473}
#hand .cmd .coin.spend{border:1px solid #f8dc84;background:repeating-linear-gradient(120deg,#453b23 0 2px,#b99b4f 2px 4px)}
#hand .cmd .snap{animation:none;border:1px solid #f8db79;color:#1b1a14;background:#f1cc61;box-shadow:0 2px 0 #a38231;letter-spacing:.05em}
#hand .cmd .snap:disabled{filter:none;background:#35404c;color:#c1c7cf;border-color:#535f6d;box-shadow:none}
#hand .cmd .auto{color:#cbd1d5;text-transform:none;letter-spacing:.035em}
@media(hover:hover){
  #hand .fan .card:not(.blocked):hover{border-color:#c0cbd4}
  #hand .fan .card.sel:hover{border-color:#ffe078}
  #hand .cmd .snap:enabled:hover{background:#ffe190}
}
@media(min-width:861px){
  #hand .cmd{border-color:#44505a}
  #hand .cmd .snap{min-height:44px}
}
@media(min-width:1150px) and (max-width:1399px){
  .sheet-cards{max-height:48dvh}
  #hand .fan{grid-template-columns:repeat(auto-fit,minmax(min(100%,100px),1fr));gap:5px}
  #hand .fan .card{padding-inline:6px}
  #hand .fan .card .art{height:45px}
}
@media(max-width:860px){
  #root.full-snap #stage{flex:0 0 auto}
  .full-snap #fieldWrap{flex:0 0 clamp(182px,29dvh,255px)}
  .full-snap #look{padding:5px 8px;gap:4px}
  #look .tag{font-size:12px}
  #hand .fan .card:not(.k-tactic) .art{display:block;margin:4px 0;height:38px}
  #hand .fan .card .setup-ready{display:block}
  #hand .cmd{background:#192532;border-color:#445461}
  #root.full-snap #hand .cmd{position:sticky;bottom:0;z-index:10;box-shadow:0 -4px 16px #060a12cc}
}
@media(min-width:861px) and (max-height:820px){
  .quick-snap #hand{max-height:54dvh;padding:0 14px 8px}
  #root.full-snap .sheet-cards{max-height:38dvh}
  #root.full-snap #hand .fan .card{min-height:132px;padding-bottom:12px}
  #root.full-snap #hand .fan .card .art{height:42px}
}

.call-forecast{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding:4px 9px;border-left:2px solid #88b8be;background:#172632;color:#e6edef;text-align:left;font:600 14px/1.2 var(--cond)}
.call-forecast small{flex-basis:100%;font:600 12px/1.2 system-ui;color:#bdcfd4}
.call-forecast span{white-space:nowrap}
.call-forecast b{color:#f6dc91;font-variant-numeric:tabular-nums}
.quick-footer .call-forecast{grid-column:2;grid-row:1;font:600 12px/1.2 system-ui}
@media(max-width:600px){.quick-footer .call-forecast{grid-column:1/-1;grid-row:2}}
@media(max-width:860px){#hand .cmd .call-forecast{grid-column:1/-1}}
@media(max-height:820px){
  .mwrap .big{font-size:clamp(34px,7vw,84px)}
  .mwrap .howto{margin:10px auto}
  .mwrap .statline{margin:6px 0;font-size:16px}
  .mwrap .btn{padding:9px 20px;font-size:18px;margin:4px}
}
@media(max-width:600px){
  .mwrap .big{font-size:clamp(28px,8vw,54px)}
  .mwrap .howto{grid-template-columns:1fr;gap:6px;margin:8px auto}
  .mwrap .btn{padding:9px 16px;font-size:16px;margin:4px}
}
.card .setup-pip{display:inline-block;margin-top:4px;padding:1px 6px;border-radius:6px;font:800 10px/1.2 var(--cond);letter-spacing:.06em;text-transform:uppercase;background:#392f1e;border:1px solid #96783d;color:var(--sequence-brass)}
.card .tactic-syn{display:inline-block;margin-top:4px;padding:1px 6px;border-radius:6px;font:800 10px/1.2 var(--cond);letter-spacing:.06em;text-transform:uppercase;background:rgba(114,240,138,.16);border:1px solid rgba(114,240,138,.5);color:#9ef5b0}
#hand .cmd .coin.rebate{border:1px solid var(--sequence-brass);background:#755b2e}
.quick-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.quick-chip{font:800 12px/1.1 var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:7px;border:1px solid #72f08a;background:rgba(114,240,138,.12);color:#d8ffe0}
.quick-chip.lean{border-color:var(--hot);background:rgba(255,154,60,.15);color:#ffd9b3}
.quick-bar .tbtn,.quick-bar select{min-height:44px;padding:4px 9px;font-size:12px}
.quick-bar .assignment{margin:0;color:#e1e8f0}
.quick-badge{display:inline-block;font-style:normal;font:800 11px/1.1 var(--cond);letter-spacing:.06em;text-transform:uppercase;margin-top:4px;padding:2px 7px;border-radius:6px;background:rgba(255,216,77,.16);border:1px solid rgba(255,216,77,.5);color:#ffe484}
.sequence-ready,.quick-receipt .sequence-ready,.call-receipt .sequence-ready{color:var(--sequence-brass,#f1c66d)}
.setup-ready.sequence-ready{color:#171300;background:var(--sequence-brass,#f1c66d)}
#hand .cmd .tbtn[data-redraw]{min-height:34px;font-size:12px;padding:4px 10px}
@media(max-width:860px){#hand .cmd .tbtn[data-redraw]{grid-column:1/-1;justify-self:start}}
@keyframes cardDeal{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
#hand .fan .card.dealt{animation:cardDeal .22s ease-out backwards;animation-delay:calc(var(--deal-i,0)*35ms)}
html.motion-reduced #hand .fan .card.dealt{animation:none!important}
@media(prefers-reduced-motion:reduce){#hand .fan .card.dealt{animation:none!important}}

/* While plays run, only the scoreboard, playing surface and live result occupy the viewport. */
#root.playback{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
#root.playback #hand,#root.playback #side,#root.playback #look,#root.playback #scorebar button{display:none}
#root.playback #stage{grid-area:2/1;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto;background:radial-gradient(ellipse at center,#243c3b,#101b24 75%)}
.playback #fieldWrap{grid-area:1/1/2/-1;position:relative;inset:auto;min-height:0;min-width:0}
.playback #callout,.playback #yards,.playback #clash,.playback #wx,.playback #flash{grid-area:1/1/2/-1;inset:0}
.playback #callout,.playback #yards{display:grid;place-items:center}
.playback #callout{container-type:inline-size;padding:10px 18px}
.playback .co{max-width:100%;font-size:clamp(26px,min(9cqw,13dvh),96px);overflow-wrap:anywhere;padding:5px clamp(10px,2vw,24px)}
.playback .co.small{font-size:clamp(22px,min(6cqw,9dvh),54px)}
.playback .co .sub{font-size:clamp(12px,.36em,27px);line-height:1.2}
.playback .co.sequence-award{background:#1b2028;color:var(--sequence-brass);border:1px solid var(--sequence-brass);border-radius:6px;box-shadow:0 4px 22px #080b0ccc;font-size:clamp(19px,4cqw,34px);padding:8px 16px}
.playback .co.sequence-award .sub{color:#f2e7cd;text-shadow:none}
.playback #ticker,.playback #matchupStory{grid-area:2/1;position:static;inset:auto;transform:none;width:auto;max-width:none;margin:0;align-self:center;align-items:flex-start;min-width:0;padding:6px 12px;text-align:left;background:#111c26}
.playback #ticker:empty,.playback #ticker .tick:not(:first-child),.playback #stage:has(#matchupStory:not([hidden])) #ticker{display:none}
.playback #ticker .tick{max-width:100%;padding:0;border:0;background:none;text-align:left;white-space:normal;overflow-wrap:anywhere}
.playback #skip{grid-area:2/2;position:static;align-self:center;margin:3px 8px;min-height:36px}
.playback #clash{overflow:auto;overscroll-behavior:contain;pointer-events:auto}
.playback .cl{flex:none;margin:auto;width:min(760px,98%);height:auto;min-height:0;padding:8px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}
.playback .cl .lab,.playback .clashmath{position:static;grid-column:1/-1}
.playback .cl .fighter{position:static;width:100%;height:auto;min-height:86px;overflow-wrap:anywhere}
.playback .cl .vs{position:static;transform:none}
.playback .cl .stamp{top:42px}
@media(max-width:540px){
  .playback .cl{gap:4px}
  .playback .cl .fighter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 6px;padding:5px 7px}
  .playback .cl .face{width:34px;height:34px}
  .playback .cl .fighter>.gr{grid-area:1/2;margin:0}
  .playback .cl .fighter>div:not(.gr){grid-column:1/-1}
  .playback .cl .vs{font-size:20px}
}
@media(max-height:480px){
  .playback .cl .fighter{min-height:0;padding:4px 8px}
  .playback .cl .face{width:32px;height:32px}
  .playback .cl .lab,.playback .cl .vs{font-size:18px}
}

.challenge-menu,.challenge-result{box-sizing:border-box;width:min(850px,100%);margin:auto;text-align:left;border:1px solid #43525d;border-top:3px solid #d6b661;border-radius:8px;padding:clamp(16px,4vw,36px);background:linear-gradient(120deg,#1a2935,#101923 78%);color:#f4f2e9;box-shadow:0 15px 40px #0005}
.challenge-menu h1,.challenge-menu h2,.challenge-result h1,.challenge-result h2{font:800 clamp(30px,5vw,52px)/1 var(--cond);letter-spacing:.015em;margin:0 0 12px}
.challenge-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(185px,100%),1fr));align-items:stretch;gap:10px;margin:18px 0}
.challenge-entry{display:flex;flex-direction:column;gap:8px;min-width:0}
.challenge-option{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:44px;padding:14px;text-align:left;border:1px solid #516271;border-top:3px solid #d6b661;border-radius:6px;color:#eff0ea;background:#1b2c38}
.challenge-entry .challenge-option{flex:1}
.challenge-option strong,.challenge-option b{font:800 23px/1.08 var(--cond)}
.challenge-option small{font:600 14px/1.3 var(--cond);color:#c7d4db}
.challenge-option:focus-visible,.challenge-option:hover{background:#253a49;border-color:#e4c874}
.challenge-option .challenge-progress,.challenge-progress{display:block;font:600 12px/1.45 system-ui,sans-serif;color:#c7d4db}
.challenge-alt{padding:0 4px}
.challenge-alt .tbtn{min-height:44px;margin-bottom:4px}
.challenge-record{padding:10px 12px;border-left:2px solid var(--sequence-brass);background:#20313d}
.challenge-record strong{display:block;margin-bottom:4px;color:#f8df97}
.challenge-objective{display:block;margin:8px 0;color:#f6dc91}
.challenge-brief{margin:6px 0;font:13px/1.45 system-ui,sans-serif;color:#c7d4db}
.challenge-brief summary{cursor:pointer;color:#f6dc91;font-weight:700}
.challenge-brief p{margin:5px 0 0}
.challenge-score{display:block;width:fit-content;margin:12px 0;font:800 clamp(26px,5vw,42px)/1.1 var(--cond);font-variant-numeric:tabular-nums;color:#f8df97}
.challenge-sticker{display:inline-flex;align-items:center;gap:7px;width:fit-content;max-width:100%;color:#f6df99;font:700 15px/1.15 var(--cond)}
.challenge-sticker:before{content:var(--sticker-mark);display:inline-grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;transform:rotate(-8deg);background:var(--sticker-fill,#e8c566);color:#18232b;font:800 16px/1 var(--cond);box-shadow:inset 0 0 0 2px #eee7d1,inset 0 0 0 3px #49505a}
[data-sticker="need_six"]{--sticker-mark:'6';--sticker-fill:#f4cc66}
[data-sticker="goal_line_stand"]{--sticker-mark:'W';--sticker-fill:#98d7be}
[data-sticker="four_minute_offense"]{--sticker-mark:'00';--sticker-fill:#a7d9eb}
</style>
</head>
<body>
<div id="root">
  <header id="scorebar"><div id="bug"></div><button type="button" class="tbtn" id="sidelineBtn" aria-haspopup="dialog" hidden>Sideline</button><button id="sheetToggle" type="button" aria-expanded="false" aria-controls="side hand" hidden>Full call sheet</button><button type="button" id="battleSettings" class="tbtn" aria-haspopup="dialog" hidden>Game settings</button></header>
  <aside id="side"></aside>
  <main id="stage">
    <div class="rays" id="rays"></div>
    <div id="fieldWrap"><svg id="field" viewBox="0 0 1200 533" role="group" aria-label="Field players. Use arrow keys to inspect the lineup."></svg><div id="fieldLocator" aria-hidden="true" hidden><span class="field-window"></span><i></i><b></b></div></div>
    <div id="look"></div>
    <div id="ticker" aria-live="polite"></div>
    <div id="drop">DROP TO CALL IT</div>
    <div id="clash"></div>
    <div id="yards"></div>
    <div id="callout"></div>
    <div class="flash" id="flash"></div>
    <button class="tbtn" id="skip">Skip ▸▸</button>
  </main>
  <footer id="hand" class="away" inert></footer>
  <div class="call-status" id="callStatus" role="status"></div>
</div>
<div id="modal" role="dialog" aria-label="Game decision" aria-modal="true" tabindex="-1"></div>
<dialog id="battlePreferences" aria-labelledby="settingsTitle">
  <form method="dialog">
    <h2 id="settingsTitle">Game settings</h2>
    <label>Motion <select id="motionMode"><option value="system">Use system preference</option><option value="reduced">Reduced motion</option><option value="instant">Instant results</option></select></label>
    <label>Replay <select id="replayMode"><option value="moments">Key moments</option><option value="all">All coached snaps</option></select></label>
    <label>Quarterback reads <select id="readPolicy"><option value="auto">Allow checkdowns</option><option value="primary">Primary only</option></select></label>
    <label><input type="checkbox" id="fastMode"> Fast playback</label>
    <label><input type="checkbox" id="soundMode"> Game sound</label>
    <label><input type="checkbox" id="fieldHighlights"> Field highlights</label>
    <fieldset><legend>Key Moments headset</legend><div id="headsetControls"></div></fieldset>
    <small data-battle-build hidden></small>
    <div class="settings-actions"><button type="button" id="settingsHelp" class="tbtn">How to play</button><button class="tbtn" autofocus>Done</button></div>
  </form>
</dialog>
<img id="trophySrc" src="../../../assets/turntables/rivalry-lantern.webp" alt="" hidden>
<canvas id="fx"></canvas>
<div class="sr" id="sr" aria-live="assertive"></div>

<script src="../../../rng.js"></script>
<script src="../../../game-conditions.js"></script>
<script src="../../../game-engine-v2.js"></script>
<script src="../core/data.js"></script>
<script src="../core/resolver.js"></script>
<script src="../../../jersey-numbers.js"></script>
<script src="../core/roster.js"></script>
<script src="../core/battle.js"></script>
<script src="../core/onboarding.js"></script>
<script src="../core/packs.js"></script>
<script src="../core/evolution.js"></script>
<script src="../core/signatures.js"></script>
<script src="../core/classes.js"></script>
<script src="../core/program.js"></script>
<script src="../core/adapter.js"></script>
<script src="../core/world.js"></script>
<script src="../../../portraits/renderer-v1.js"></script>
<script src="fx.js"></script>
<script src="cards.js"></script>
<script src="../core/playbook-ui.js"></script>
<script src="challenge-awards.js"></script>
<script src="slice.js"></script>
</body>
