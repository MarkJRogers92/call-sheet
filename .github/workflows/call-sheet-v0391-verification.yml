name: Call Sheet v0.39.1 browser verification
on:
  push:
    branches: [codex/verify-v0391]
permissions:
  contents: read
jobs:
  weekly-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build && git diff --exit-code -- index.html sw.js
      - run: npm run test:card-pages-browser
