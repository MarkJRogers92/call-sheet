name: Verify live Call Sheet v0.39.1
on:
  push:
    branches: [codex/verify-v0391]
permissions:
  contents: read
jobs:
  hosted-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the served Dynasty and Quick Battle fingerprints
        shell: bash
        run: |
          check_page() {
            local url="$1" output="$2"
            for attempt in {1..24}; do
              if curl -fsSL --max-time 12 "$url?build=751a169479c1" -o "$output" &&
                grep -Fq 'name="call-sheet-build" content="751a169479c1"' "$output"; then
                echo "$url"
                sha256sum "$output"
                return
              fi
              sleep 5
            done
            echo "Expected build not served at $url" >&2
            return 1
          }
          check_page 'https://markjrogers92.github.io/call-sheet/' "$RUNNER_TEMP/dynasty.html"
          check_page 'https://markjrogers92.github.io/call-sheet/battle/' "$RUNNER_TEMP/battle.html"
